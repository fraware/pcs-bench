[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcs-bench"
version = "0.3.0"
description = "Evaluation harness for Proof-Carrying Science (PCS) releases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PCS Bench Contributors" }]
keywords = ["pcs", "benchmark", "proof-carrying-science", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pcs-bench = "pcs_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pcs_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/pcs_bench/schemas/json" = "pcs_bench/schemas/json"

[tool.hatch.build.targets.sdist]
only-include = ["src", "benchmarks", "docs", "pcs-bench.yaml", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
