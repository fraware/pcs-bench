name: PCS Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_live_labtrust:
        description: Run LabTrust live gate (requires sibling repos)
        type: boolean
        default: false

env:
  PCS_CORE_PATH: ${{ github.workspace }}/pcs-core
  LABTRUST_PATH: ${{ github.workspace }}/LabTrust-Gym

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]" ruff

      - name: Ruff
        run: ruff check src tests

      - name: Unit and integration tests
        run: python -m pytest -q

  simulate-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Checkout pcs-core schemas
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
        continue-on-error: true

      - name: Sync embedded schemas
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core
        continue-on-error: true

      - name: Run simulate release gate
        shell: bash
        run: |
          if [ -d pcs-core/schemas ]; then
            python -m pcs_bench gate --suite all --out reports/ci.json --out-packet packets/ci --pcs-core pcs-core --reproduce-smoke
          else
            python -m pcs_bench gate --suite all --out reports/ci.json --out-packet packets/ci --reproduce-smoke
          fi

      - name: Generate reports
        run: |
          python -m pcs_bench report --input reports/ci.json --format markdown --out reports/ci.md
          python -m pcs_bench report --input reports/ci.json --format html --out reports/ci.html
          python -m pcs_bench report --input reports/ci.json --format csv --out reports/ci.csv

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcs-bench-simulate-gate
          path: |
            reports/ci.json
            reports/ci.md
            reports/ci.html
            reports/ci.csv
            packets/ci
            benchmarks/fixture_manifest.json

  live-labtrust-gate:
    runs-on: ubuntu-latest
    needs: simulate-gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_live_labtrust == true
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pcs-core
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
        continue-on-error: true

      - name: Checkout LabTrust-Gym
        uses: actions/checkout@v4
        with:
          repository: fraware/LabTrust-Gym
          path: LabTrust-Gym
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Sync schemas from pcs-core
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core
        continue-on-error: true

      - name: Check adapters
        run: |
          python -m pcs_bench check-adapters \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym

      - name: Live LabTrust benchmark (release gate)
        run: |
          python -m pcs_bench run \
            --suite labtrust-qc-release \
            --live \
            --ci \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym \
            --out reports/live-labtrust.json

      - name: Validate live report
        run: python -m pcs_bench validate-report --input reports/live-labtrust.json --schema-source pcs-core

      - name: Upload live report
        uses: actions/upload-artifact@v4
        with:
          name: pcs-bench-live-labtrust
          path: reports/live-labtrust.json
