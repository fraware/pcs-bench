name: Agent evidence boundary conformance

on:
  pull_request:
    paths:
      - "src/pcs_bench/evidence_boundary.py"
      - "docs/guarded-target-study.md"
      - "tests/integration/test_acs_guarded_target.py"
      - "tests/integration/test_guarded_effect_target.py"
      - "src/pcs_bench/guarded_study.py"
      - "src/pcs_bench/guarded_target.py"
      - "tests/fixtures/acs_effect/effect_guard.cedar"
      - "tests/fixtures/acs_effect/manifest.yaml"
      - "tests/integration/test_acs_effect_host.py"
      - "src/pcs_bench/acs_effect_host.py"
      - "src/pcs_bench/acs_effect_study.py"
      - "docs/effect-commit-study.md"
      - "tests/integration/test_effect_study.py"
      - "tests/integration/test_effect_commit_boundary.py"
      - "tests/unit/test_effect_boundary.py"
      - "src/pcs_bench/effect_study.py"
      - "src/pcs_bench/effect_target.py"
      - "src/pcs_bench/effect_boundary.py"
      - "tests/unit/test_evidence_boundary.py"
      - "tests/integration/test_pf_core_evidence_boundary.py"
      - "docs/agent-evidence-boundaries.md"
      - ".github/workflows/agent-evidence-boundaries.yml"
  push:
    branches: [main]
    paths:
      - "src/pcs_bench/evidence_boundary.py"
      - "docs/guarded-target-study.md"
      - "tests/integration/test_acs_guarded_target.py"
      - "tests/integration/test_guarded_effect_target.py"
      - "src/pcs_bench/guarded_study.py"
      - "src/pcs_bench/guarded_target.py"
      - "tests/fixtures/acs_effect/effect_guard.cedar"
      - "tests/fixtures/acs_effect/manifest.yaml"
      - "tests/integration/test_acs_effect_host.py"
      - "src/pcs_bench/acs_effect_host.py"
      - "src/pcs_bench/acs_effect_study.py"
      - "docs/effect-commit-study.md"
      - "tests/integration/test_effect_study.py"
      - "tests/integration/test_effect_commit_boundary.py"
      - "tests/unit/test_effect_boundary.py"
      - "src/pcs_bench/effect_study.py"
      - "src/pcs_bench/effect_target.py"
      - "src/pcs_bench/effect_boundary.py"
      - "tests/unit/test_evidence_boundary.py"
      - "tests/integration/test_pf_core_evidence_boundary.py"
      - "docs/agent-evidence-boundaries.md"
      - ".github/workflows/agent-evidence-boundaries.yml"
  workflow_dispatch:

jobs:
  pinned-source-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v4

      - name: Checkout pinned PF-Core source
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/provability-fabric-core
          ref: b853bea6d79a6c683928031885176efef851aa5a
          path: external/pf-core
          persist-credentials: false

      - name: Verify exact upstream commit
        shell: bash
        run: |
          test "$(git -C external/pf-core rev-parse HEAD)" = \
            "b853bea6d79a6c683928031885176efef851aa5a"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install benchmark and test dependencies
        run: python -m pip install -e ".[dev]" ruff

      - name: Lint conformance sources
        run: |
          ruff check src/pcs_bench/evidence_boundary.py \
            tests/unit/test_evidence_boundary.py \
            tests/integration/test_pf_core_evidence_boundary.py \
            src/pcs_bench/effect_boundary.py \
            src/pcs_bench/effect_target.py \
            src/pcs_bench/effect_study.py \
            tests/unit/test_effect_boundary.py \
            tests/integration/test_effect_commit_boundary.py \
            tests/integration/test_effect_study.py \
            src/pcs_bench/guarded_target.py \
            tests/integration/test_guarded_effect_target.py

      - name: Run positive, negative, and upstream-source probes
        env:
          PF_CORE_REPO: ${{ github.workspace }}/external/pf-core
        run: |
          python -m pytest -q \
            tests/unit/test_evidence_boundary.py \
            tests/integration/test_pf_core_evidence_boundary.py \
            tests/unit/test_effect_boundary.py \
            tests/integration/test_effect_commit_boundary.py \
            tests/integration/test_effect_study.py \
            tests/integration/test_guarded_effect_target.py

      - name: Generate target-side effect experiment report
        run: |
          mkdir -p reports
          python -m pcs_bench.effect_study --out reports/agent-effect-study.json

      - name: Upload effect study artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-effect-study-python-${{ matrix.python-version }}
          path: reports/agent-effect-study.json
          if-no-files-found: error

  acs-cedar-effect-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the published ACS native runtime and Agent Hooks SDK
        run: |
          python -m pip install -e ".[dev]" ruff "agent-control-spec==0.4.0a4"
          python -m pip check

      - name: Lint ACS host and integration tests
        run: |
          ruff check src/pcs_bench/acs_effect_host.py \
            src/pcs_bench/acs_effect_study.py \
            tests/integration/test_acs_effect_host.py \
            src/pcs_bench/guarded_study.py \
            tests/integration/test_acs_guarded_target.py

      - name: Run genuine Cedar authorization against disposable target
        env:
          ACS_EFFECT_INTEGRATION: "1"
        run: |
          python -m pytest -q \
            tests/integration/test_acs_effect_host.py \
            tests/integration/test_acs_guarded_target.py

      - name: Produce source-bound real ACS/Cedar experiment report
        env:
          ACS_EFFECT_INTEGRATION: "1"
        run: |
          mkdir -p reports
          python -m pcs_bench.acs_effect_study --out reports/acs-effect-study.json

      - name: Upload real ACS effect study
        uses: actions/upload-artifact@v4
        with:
          name: real-acs-cedar-study-python-${{ matrix.python-version }}
          path: reports/acs-effect-study.json
          if-no-files-found: error
      - name: Generate real ACS target-owned commit-time policy report
        env:
          ACS_EFFECT_INTEGRATION: "1"
        run: |
          python -m pcs_bench.guarded_study --out reports/acs-guarded-target-study.json

      - name: Upload target-owned policy report
        uses: actions/upload-artifact@v4
        with:
          name: guarded-acs-target-python-${{ matrix.python-version }}
          path: reports/acs-guarded-target-study.json
          if-no-files-found: error
