name: Independent signed-evidence verification

on:
  push:
    branches: [research/independent-signed-evidence-verifier]
    paths:
      - "src/pcs_bench/independent_ed25519.py"
      - "tests/unit/test_independent_ed25519.py"
      - "tests/integration/test_independent_signature_producer.py"
      - "docs/independent-signed-evidence.md"
      - "pyproject.toml"
      - ".github/workflows/independent-ed25519.yml"
  pull_request:
    paths:
      - "src/pcs_bench/independent_ed25519.py"
      - "tests/unit/test_independent_ed25519.py"
      - "tests/integration/test_independent_signature_producer.py"
      - "docs/independent-signed-evidence.md"
      - "pyproject.toml"
      - ".github/workflows/independent-ed25519.yml"

jobs:
  independent-assertions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout separately pinned producer signing implementation
        uses: actions/checkout@v4
        with:
          ref: 423aa6d8682117474b22dd960da62b490f148361
          path: producer-reference
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and exact experimental crypto dependency
        run: |
          python -m pip install -e ".[dev]" "cryptography==46.0.4" ruff
          python -m pip check
      - name: Lint independently reviewable module and fixtures
        run: |
          ruff check src/pcs_bench/independent_ed25519.py \
            tests/unit/test_independent_ed25519.py
      - name: Run real Ed25519 positive and adversarial cases
        run: |
          python -m pytest -q tests/unit/test_independent_ed25519.py
      - name: Verify signed records from pinned producer in separate Python interpreter
        env:
          PCS_PINNED_PRODUCER: ${{ github.workspace }}/producer-reference
        run: |
          python -m pytest -q tests/integration/test_independent_signature_producer.py

