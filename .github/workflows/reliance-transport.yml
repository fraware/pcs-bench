name: Reliance transport appraisal

on:
  pull_request:
    paths:
      - "src/pcs_bench/reliance_transport.py"
      - "tests/unit/test_reliance_transport.py"
      - "docs/reliance-transport-contract.md"
      - ".github/workflows/reliance-transport.yml"
  push:
    branches: [research/reliance-transport-appraisal]
    paths:
      - "src/pcs_bench/reliance_transport.py"
      - "tests/unit/test_reliance_transport.py"
      - "docs/reliance-transport-contract.md"
      - ".github/workflows/reliance-transport.yml"
  workflow_dispatch:

jobs:
  reliance-appraisal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install -e ".[dev]" ruff
          python -m pip check
      - name: Lint only the independently reviewable module and tests
        run: |
          ruff check src/pcs_bench/reliance_transport.py \
            tests/unit/test_reliance_transport.py
      - name: Run current-context transport and negative control tests
        run: |
          python -m pytest -q tests/unit/test_reliance_transport.py
