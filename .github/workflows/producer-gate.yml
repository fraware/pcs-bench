name: PCS Producer Gate

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run producer gate in live mode (no fixture fallback)
        type: boolean
        default: false

jobs:
  producer-ingest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Sync schemas
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core
        continue-on-error: true

      - name: Sync golden ingest fixtures
        run: python scripts/sync_pcs_core_ingest_fixtures.py --pcs-core pcs-core
        continue-on-error: true

      - name: Validate producer fixtures
        run: python scripts/validate_producer_ingest_fixtures.py --pcs-core pcs-core

  producer-offline-gate:
    runs-on: ubuntu-latest
    needs: producer-ingest-validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Offline producer gate (fixtures)
        run: |
          python -m pcs_bench gate --suite all --simulate \
            --run-producer-benchmarks --use-producer-fixtures --reproduce-smoke \
            --out reports/producer-gate-offline.json \
            --out-packet packets/producer-gate-offline \
            --pcs-core pcs-core

      - name: Upload offline gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcs-producer-gate-offline
          path: |
            reports/producer-gate-offline.json
            reports/producer_merge_manifest.v0.json
            packets/producer-gate-offline

  producer-live-gate:
    runs-on: ubuntu-latest
    needs: producer-ingest-validate
    if: inputs.run_live == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core

      - uses: actions/checkout@v4
        with:
          repository: fraware/LabTrust-Gym
          path: LabTrust-Gym

      - uses: actions/checkout@v4
        with:
          repository: fraware/CertifyEdge
          path: CertifyEdge

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/provability-fabric
          path: provability-fabric

      - uses: actions/checkout@v4
        with:
          repository: fraware/scientific-memory
          path: scientific-memory

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Sync schemas
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core

      - name: Producer doctor (diagnostic)
        run: |
          python -m pcs_bench producer-doctor \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym \
            --certifyedge CertifyEdge \
            --provability-fabric provability-fabric \
            --scientific-memory scientific-memory \
            --json-out reports/producer-doctor.json \
            --release-grade || true

      - name: Check producer ingests (release-grade)
        run: |
          python -m pcs_bench check-producer-ingests --release-grade \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym \
            --certifyedge CertifyEdge \
            --provability-fabric provability-fabric \
            --scientific-memory scientific-memory

      - name: Live producer gate (no fixture fallback)
        run: |
          python -m pcs_bench gate --suite all --live \
            --run-producer-benchmarks --reproduce-smoke \
            --out reports/producer-gate.json \
            --out-packet packets/producer-gate \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym \
            --certifyedge CertifyEdge \
            --provability-fabric provability-fabric \
            --scientific-memory scientific-memory

      - name: Upload live gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcs-producer-gate-live
          path: |
            reports/producer-gate.json
            reports/producer-doctor.json
            reports/producer_gate_result.v0.json
            reports/producer_merge_manifest.v0.json
            packets/producer-gate
            packets/producer-gate/packet_reproduction_report.v0.json
