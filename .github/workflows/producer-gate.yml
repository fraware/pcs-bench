name: PCS Producer Gate

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run pcs-bench suites in live mode
        type: boolean
        default: true

jobs:
  producer-ingest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Sync schemas
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core
        continue-on-error: true

      - name: Sync golden ingest fixtures
        run: python scripts/sync_pcs_core_ingest_fixtures.py --pcs-core pcs-core
        continue-on-error: true

      - name: Validate producer fixtures
        run: python scripts/validate_producer_ingest_fixtures.py --pcs-core pcs-core

  producer-full-gate:
    runs-on: ubuntu-latest
    needs: producer-ingest-validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core

      - uses: actions/checkout@v4
        with:
          repository: fraware/LabTrust-Gym
          path: LabTrust-Gym
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          repository: fraware/CertifyEdge
          path: CertifyEdge
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/provability-fabric
          path: provability-fabric
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          repository: fraware/scientific-memory
          path: scientific-memory
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pcs-bench
        run: pip install -e ".[dev]"

      - name: Sync schemas
        run: python scripts/sync_pcs_core_schema.py --pcs-core pcs-core

      - name: Check producer ingests
        run: |
          python -m pcs_bench check-producer-ingests \
            --pcs-core pcs-core \
            --labtrust LabTrust-Gym \
            --certifyedge CertifyEdge \
            --provability-fabric provability-fabric \
            --scientific-memory scientific-memory
        continue-on-error: true

      - name: Full producer gate
        run: |
          ARGS="--suite all --out reports/producer-gate.json --out-packet packets/producer-gate --pcs-core pcs-core --run-producer-benchmarks --reproduce-smoke --labtrust LabTrust-Gym --certifyedge CertifyEdge --provability-fabric provability-fabric --scientific-memory scientific-memory"
          if [ "${{ inputs.run_live }}" = "true" ]; then
            python -m pcs_bench gate $ARGS --live
          else
            python -m pcs_bench gate $ARGS --simulate
          fi
        continue-on-error: true

      - name: Upload producer gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcs-producer-gate
          path: |
            reports/producer-gate.json
            packets/producer-gate
